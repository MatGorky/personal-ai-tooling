[project]
name = "gdocs-mcp"
version = "0.1.0"
description = "A minimal MCP server that reads public and shared Google Docs"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdocs_mcp"]
